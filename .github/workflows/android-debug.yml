name: Android debug APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-debug.yml'
  workflow_dispatch:

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v6

      # google-services.json is gitignored (kept out of the public repo); the
      # Google Services plugin needs it at build time. Decode it from a secret.
      - name: Write google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/google-services.json

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Compute APK metadata
        id: meta
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          sha="${GITHUB_SHA:0:7}"
          date="$(date -u +%Y-%m-%d)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "apk_name=ibkr-mobile-${date}-${sha}-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Stage APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "../dist/${{ steps.meta.outputs.apk_name }}"
          ls -lh ../dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ibkr-mobile-debug-${{ steps.meta.outputs.sha }}
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error
