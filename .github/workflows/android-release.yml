name: Android release

# Build a GitHub Release with an installable APK whenever a v* tag is pushed.
#
# Why assembleDebug and not assembleRelease:
#   The release variant has minify+proguard enabled but no signingConfig in
#   app/build.gradle.kts, so assembleRelease would produce an unsigned APK
#   that won't install. assembleDebug builds a working APK signed with the
#   default debug keystore — fine for personal sideloading. Switch to a
#   real release-signed build once a keystore secret is wired up.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release'
        required: true

permissions:
  contents: write  # required to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # release-notes generation looks at history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # versionName: tag without the leading "v" (e.g. v0.1.0-alpha.20260601 -> 0.1.0-alpha.20260601)
          version_name="${tag#v}"
          # date for versionCode: prefer the YYYYMMDD embedded in an alpha/beta tag,
          # fall back to the build date (UTC) for stable tags that carry no date.
          if [[ "$version_name" =~ (alpha|beta)\.([0-9]{8}) ]]; then
            date="${BASH_REMATCH[2]}"
          else
            date="$(date -u +%Y%m%d)"
          fi
          # daily sequence (0-based): how many tags already carry this date, minus the current one.
          count="$(git tag --list "*${date}*" | wc -l | tr -d ' ')"
          seq=$(( count > 0 ? count - 1 : 0 ))
          # versionCode = YYYYMMDD * 100 + seq  (monotonic, same-day-safe, < 2.1e9 until year 2099)
          version_code=$(( 10#$date * 100 + seq ))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$version_name versionCode=$version_code (date=$date seq=$seq)"

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -PappVersionName="${{ steps.ver.outputs.version_name }}" \
            -PappVersionCode="${{ steps.ver.outputs.version_code }}"

      - name: Stage APK with tag in name
        id: stage
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/ibkr-mobile-${tag}.apk"
          ls -lh dist/
          echo "apk=dist/ibkr-mobile-${tag}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: ${{ steps.stage.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.stage.outputs.apk }}
          fail_on_unmatched_files: true
