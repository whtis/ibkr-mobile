name: Android release

# Build a GitHub Release with an installable APK whenever a v* tag is pushed.
#
# Builds assembleRelease signed with the release keystore. The keystore lives
# only in GitHub Secrets (base64), is decoded into RUNNER_TEMP at build time,
# and the signature is verified to NOT be the debug key before publishing.
# versionName / versionCode are parsed from the tag (see "Derive version").
#
# Required repo secrets:
#   ANDROID_KEYSTORE_BASE64  - base64 of the release .jks (no newlines)
#   ANDROID_KEY_ALIAS        - key alias inside the keystore
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release'
        required: true

permissions:
  contents: write  # required to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # release-notes generation looks at history

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: ver
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          # versionName: tag without the leading "v" (e.g. v1.0.0-beta.20260601 -> 1.0.0-beta.20260601)
          version_name="${tag#v}"
          # date for versionCode:
          #   - alpha/beta: the YYYYMMDD embedded in the tag name
          #   - stable (no date): the UTC build date, but never earlier than any
          #     date already present in an existing tag (avoids a same-day stable
          #     getting a smaller code than its beta when timezones disagree).
          if [[ "$version_name" =~ (alpha|beta)\.([0-9]{8}) ]]; then
            date="${BASH_REMATCH[2]}"
          else
            build_date="$(date -u +%Y%m%d)"
            max_tag_date="$(git tag --list | grep -oE '[0-9]{8}' | sort -n | tail -1 || true)"
            date="$build_date"
            if [[ -n "$max_tag_date" && "$max_tag_date" -gt "$build_date" ]]; then date="$max_tag_date"; fi
          fi
          # seq (0-based) = number of OTHER tags carrying this date (= prior same-day releases).
          # Excluding the current tag fixes the same-day beta->stable collision.
          others="$(git tag --list "*${date}*" | grep -vFx "$tag" || true)"
          if [[ -z "$others" ]]; then seq=0; else seq="$(printf '%s\n' "$others" | grep -c .)"; fi
          # versionCode = YYYYMMDD * 100 + seq  (monotonic, same-day-safe, < 2.1e9 until year 2099)
          version_code=$(( 10#$date * 100 + seq ))
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$version_name versionCode=$version_code (date=$date seq=$seq)"

      - name: Decode release keystore
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"  # fail hard if the secret is missing/empty

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PappVersionName="${{ steps.ver.outputs.version_name }}" \
            -PappVersionCode="${{ steps.ver.outputs.version_code }}"

      - name: Verify release signature (reject debug key)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK=android/app/build/outputs/apk/release/app-release.apk
          certs="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the DEBUG key, not the release key — aborting"
            exit 1
          fi

      - name: Stage APK with tag in name
        id: stage
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/ibkr-mobile-${tag}.apk"
          ls -lh dist/
          echo "apk=dist/ibkr-mobile-${tag}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: ${{ steps.stage.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}  # alpha/beta tags -> prerelease
          files: ${{ steps.stage.outputs.apk }}
          fail_on_unmatched_files: true
