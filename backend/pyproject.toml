[project]
name = "ibkr-backend"
version = "0.1.0"
description = "Personal IBKR mobile client backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "ib-async>=1.0.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # longport 3.x wheels require glibc >= 2.39 (manylinux_2_39).
    # Pin to 2.x so installs work on Debian 12 / Ubuntu 22.04 and older.
    "longport>=2.0,<3",
    "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]
